<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Ombra esterna del pulsante -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Gradiente del pulsante blu (dal chiaro in alto al scuro in basso) -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4568" />
      <stop offset="100%" stop-color="#182b45" />
    </linearGradient>

    <!-- Griglia di sfondo (ciano scuro/trasparente) -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#48cae4" stroke-width="1" stroke-opacity="0.2" />
    </pattern>

    <!-- Punta freccia per le quote -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#48cae4" />
    </marker>

    <!-- Maschera per nascondere la griglia all'interno della T -->
    <mask id="mask-t">
      <rect width="1024" height="1024" fill="white" />
      <path d="M 290 280 L 734 280 L 734 400 L 576 400 L 576 768 L 448 768 L 448 400 L 290 400 Z" fill="black" />
    </mask>
  </defs>

  <!-- Sfondo trasparente del canvas -->
  <rect width="1024" height="1024" fill="transparent" />

  <!-- Corpo del pulsante con ombra e gradiente -->
  <rect x="162" y="162" width="700" height="700" rx="120" ry="120" fill="url(#btn-grad)" filter="url(#drop-shadow)" />

  <!-- Bordo interno leggero per simulare lo smusso 3D -->
  <rect x="162" y="162" width="700" height="700" rx="120" ry="120" fill="none" stroke="#3d638f" stroke-width="2" opacity="0.8" />

  <!-- Griglia posizionata per coprire l'intera altezza della T (con maschera di esclusione per l'interno) -->
  <rect x="250" y="240" width="524" height="560" fill="url(#grid)" mask="url(#mask-t)" />

  <!-- Assi tratteggiati (orizzontale e verticale centrale) -->
  <g mask="url(#mask-t)">
    <line x1="200" y1="535" x2="824" y2="535" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
    <line x1="512" y1="200" x2="512" y2="800" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  </g>

  <!-- LE QUOTE E LE LINEE DI ESTENSIONE CIANO -->
  <g stroke="#48cae4" stroke-width="1.5">
    <!-- Quota orizzontale superiore -->
    <line x1="290" y1="180" x2="290" y2="280" />
    <line x1="734" y1="180" x2="734" y2="280" />
    <line x1="305" y1="210" x2="719" y2="210" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    
    <!-- Quota verticale sinistra -->
    <line x1="250" y1="280" x2="310" y2="280" />
    <line x1="250" y1="400" x2="310" y2="400" />
    <line x1="270" y1="295" x2="270" y2="385" marker-start="url(#arrow)" marker-end="url(#arrow)" />

    <!-- Quota verticale destra -->
    <line x1="714" y1="280" x2="784" y2="280" />
    <line x1="714" y1="768" x2="784" y2="768" />
    <line x1="760" y1="295" x2="760" y2="753" marker-start="url(#arrow)" marker-end="url(#arrow)" />

    <!-- Quota orizzontale inferiore -->
    <line x1="448" y1="768" x2="448" y2="840" />
    <line x1="576" y1="768" x2="576" y2="840" />
    <line x1="463" y1="810" x2="561" y2="810" marker-start="url(#arrow)" marker-end="url(#arrow)" />

    <!-- Arco e linee in basso a destra -->
    <path d="M 640 768 A 128 128 0 0 1 734 650" fill="none" stroke="#48cae4" stroke-width="2" />
    <line x1="640" y1="768" x2="750" y2="768" stroke="#48cae4" stroke-width="1" opacity="0.6" />
    <line x1="734" y1="650" x2="734" y2="768" stroke="#48cae4" stroke-width="1" opacity="0.6" />
  </g>

  <!-- LA LETTERA T (Contorno e nervature interne a profilato) -->
  <g stroke-linejoin="round">
    <!-- Contorno perimetrale bianco spesso -->
    <path d="M 290 280 L 734 280 L 734 400 L 576 400 L 576 768 L 448 768 L 448 400 L 290 400 Z" fill="none" stroke="#ffffff" stroke-width="3.5" />

    <!-- Estremità sinistra a triangolo -->
    <path d="M 290 280 L 350 340 L 290 400" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    
    <!-- Estremità destra a triangolo -->
    <path d="M 734 280 L 674 340 L 734 400" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    
    <!-- Giuntura centrale (angoli interni) -->
    <path d="M 448 400 L 512 340 L 576 400" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    
    <!-- Estremità inferiore a triangolo -->
    <path d="M 448 768 L 512 708 L 576 768" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    
    <!-- Dorsale orizzontale e verticale -->
    <line x1="350" y1="340" x2="674" y2="340" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    <line x1="512" y1="340" x2="512" y2="708" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
  </g>

  <!-- Punti di Snap azzurri ai vertici -->
  <g fill="#48cae4">
    <!-- Vertici perimetrali -->
    <rect x="287" y="277" width="6" height="6" />
    <rect x="731" y="277" width="6" height="6" />
    <rect x="731" y="397" width="6" height="6" />
    <rect x="573" y="397" width="6" height="6" />
    <rect x="573" y="765" width="6" height="6" />
    <rect x="445" y="765" width="6" height="6" />
    <rect x="445" y="397" width="6" height="6" />
    <rect x="287" y="397" width="6" height="6" />
    
    <!-- Vertici interni della struttura 3D -->
    <rect x="509" y="337" width="6" height="6" />
    <rect x="509" y="705" width="6" height="6" />
    <rect x="347" y="337" width="6" height="6" />
    <rect x="671" y="337" width="6" height="6" />
  </g>

  
</svg>