# SonarQube Cloud analysis, run nightly on main by .github/workflows/sonar.yml
# (decision of 2026-11-08, docs/DECISIONI.md, #625). Automatic analysis is off
# on the Sonar side: this file and the workflow are the only configuration.
sonar.projectKey=Matleyx78_tecnigrafo
sonar.organization=matleyx78
sonar.projectName=Tecnigrafo
sonar.sourceEncoding=UTF-8

sonar.sources=core,io,render,edit,cmd,script,mcp,tools,app
sonar.tests=tests
# solid-space is analysed in its own project; the build folders hold generated
# files (moc, uic, rcc); the verification cases are data, not code.
sonar.exclusions=third_party/**,build*/**
sonar.test.exclusions=tests/verifica/casi/**,build*/**

# C++ is analysed from the compilation database of the release preset, without
# the Build Wrapper; the workflow builds that preset before the scan.
sonar.cfamily.compile-commands=build/release/compile_commands.json
