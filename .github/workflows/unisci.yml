#
# The merge command of the owner (docs/GUIDA-RESPONSABILE.md, A3;
# docs/DECISIONI.md, 2026-11-28, Catena 6): the label AAA-UNISCI, put by the
# owner on a pull request, runs scripts/unisci.py, which checks the review,
# the checks, `decisione` and «main rosso», updates the branch with main when
# main has new code (and waits for the CI), then squashes and merges with the
# owner's Signed-off-by line. It merges with the RELAY_PAT secret, so "Dopo il
# merge" starts as after a merge by hand. The label is taken away at the end,
# merged or not: to try again, put it back.
#
# pull_request_target runs this file and the scripts as they are on main, never
# the ones of the pull request. The agents use the owner's account too: they
# never put AAA-UNISCI (AGENTS.md). Several labels run one at a time, in order.
name: Unisci

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: unisci
  cancel-in-progress: false

jobs:
  unisci:
    if: >-
      github.event.label.name == 'AAA-UNISCI' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The default branch, not the head of the pull request.
      - uses: actions/checkout@v7
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/unisci.py "$PR"
