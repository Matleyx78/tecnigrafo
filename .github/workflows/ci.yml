# Continuous integration: every push and pull request must pass all jobs.
# Changes that touch only documentation skip the build jobs: they show as
# "skipped", which GitHub counts as passed for required checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether anything besides documentation changed
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit: running all jobs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"
          echo "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: build jobs skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # docs/adr/0011: a pull request either writes reference cases or does the
  # work, never both. tests/verifica/in-attesa.txt may change in either.
  references:
    name: Reference separation (ADR 0011)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check that references and other files are not mixed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          references=$(echo "$changed" | grep -E '^tests/verifica/(casi/|sorgenti\.json$)' || true)
          others=$(echo "$changed" | grep -vE '^tests/verifica/(casi/|sorgenti\.json$|in-attesa\.txt$)' | grep -v '^$' || true)
          if [ -n "$references" ] && [ -n "$others" ]; then
            echo "::error::This pull request changes reference cases together with other files."
            echo "Reference files changed:"
            echo "$references"
            echo "Other files changed:"
            echo "$others"
            echo "Split it: references and work go in separate pull requests (docs/adr/0011)."
            exit 1
          fi
          echo "Reference separation respected."

  format:
    name: Formatting (clang-format 18)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror

  linux:
    name: Linux (GCC, clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgtest-dev clang-tidy-18
      - uses: actions/cache@v4
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build, warnings as errors
        run: |
          cmake --preset ci
          cmake --build --preset ci
      - name: Test
        run: ctest --preset ci -LE verifica
      - name: Static analysis
        run: |
          cmake --preset tidy
          cmake --build --preset tidy

  verifica:
    name: Verifica
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgtest-dev
      - uses: actions/cache@v4
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build verification tools
        run: |
          cmake --preset ci
          cmake --build --preset ci --target tecnigrafo-script tecnigrafo confronta_immagini
      - name: Verifica
        run: ctest --preset ci -L verifica --no-tests=error
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-linux
          path: |
            build/ci/tests/verifica/casi*/
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  # docs/adr/0016: every test, verification cases and application included,
  # runs instrumented; a memory error or undefined behaviour fails the job.
  sanitizers:
    name: Linux (ASan, UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgtest-dev
      - uses: actions/cache@v4
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build with AddressSanitizer and UBSan
        run: |
          cmake --preset asan
          cmake --build --preset asan
      - name: Test
        run: ctest --preset asan -LE verifica
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset asan -L verifica --no-tests=error
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-sanitizers
          path: |
            build/asan/tests/verifica/casi*/
            build/asan/Testing/Temporary/LastTest.log
            build/asan/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  windows:
    name: Windows (MSVC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/cache@v4
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build, warnings as errors
        run: |
          cmake --preset ci -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build --preset ci
      - name: Test
        run: ctest --preset ci -LE verifica
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ci -L verifica --no-tests=error
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-windows
          path: |
            build/ci/tests/verifica/casi*/
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  macos:
    name: macOS (Apple Clang)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install ninja
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - uses: actions/cache@v4
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build, warnings as errors
        run: |
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build --preset ci
      - name: Test
        run: ctest --preset ci -LE verifica
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset ci -L verifica --no-tests=error
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-macos
          path: |
            build/ci/tests/verifica/casi*/
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
