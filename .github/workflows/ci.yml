# Continuous integration: every push and pull request must pass all jobs.
# Changes that touch only documentation skip the build jobs: they show as
# "skipped", which GitHub counts as passed for required checks.
#
# clang-tidy: a pull request checks only the files it touches (and the ones
# that mention a touched header), on the build of the "Build" step, with no
# second build. The whole project is checked on every push to main, every
# night, and in a pull request that changes .clang-tidy, CMake or this file.
#
# Every ctest runs as many tests at once as the machine has processors
# (0.7.5-P38). gtest_discover_tests makes every case of tg_tests a process of
# its own (1673 of them, 0.21 s each under ASan) and each of the 726
# verification cases starts the program, while the runners have 3 or 4
# processors: one test at a time, the ASan job spent 423 s in Test and 146 s
# in Verifica out of 648 s (run of #605). Tests must therefore never share a
# folder with a fixed name; the order of ctest's output changes, its lines do
# not, and scripts/ci-annota.sh reads them as before.
#
# Configurations (docs/adr/0038, point 3): Linux builds Debug (clang-tidy,
# sanitizers, fuzzing, verification) and Release; Windows and macOS build only
# Release, with tests and verification. Every Release job uses the preset
# ci-release, with warnings as errors, and every target has the floating-point
# options of docs/adr/0038, point 4 (cmake/TecnigrafoDeterminism.cmake). The
# job names say the configuration. After the three Release jobs, the job
# "Cross-platform comparison" checks that their verification reports are the
# same (docs/adr/0038, point 5; docs/verifica/sistemi.md).
name: CI

on:
  push:
    branches: [main]
  # "edited" too, for the job "Submodule pointer": it reads the issues that the
  # description of the pull request closes, so a new "Closes #N" must check the
  # pointer again. The whole run starts again, not that job only: a run with
  # that job only would cancel the build of the same pull request (concurrency
  # below) and would be the latest run of the commit, the one that
  # scripts/ci-attendi.sh waits for.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# docs/adr/0043, point 3: aqtinstall 3.3.0, the latest release, cannot install
# Qt 6.11 or later on Windows. Until a release can, every Qt step installs
# aqtinstall from this commit of its main branch, which contains 7e5a5c3
# ("Support Qt 6.11+ for Windows x64"), with py7zr pinned because that
# aqtinstall asks for it without an upper bound. When a release supports Qt
# 6.12 on Windows, drop these two values and the aqtsource and py7zrversion
# lines of the Qt steps. The same values are in copilot-setup-steps.yml.
env:
  TG_AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
  TG_PY7ZR_VERSION: '==1.1.4'

# A newer push cancels the run of a pull request, never the run of main: the
# whole-project tidy takes long and must not be cancelled by the next merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      gallery: ${{ steps.filter.outputs.gallery }}
      io: ${{ steps.filter.outputs.io }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether anything besides documentation changed
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit: running all jobs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "gallery=true" >> "$GITHUB_OUTPUT"
            echo "io=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(io/|third_party/|tests/fuzz/)'; then
            echo "io=true" >> "$GITHUB_OUTPUT"
          else
            echo "io=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(app/|resources/)'; then
            echo "gallery=true" >> "$GITHUB_OUTPUT"
          else
            echo "gallery=false" >> "$GITHUB_OUTPUT"
          fi
          code=$(echo "$changed" | grep -vE '^docs/|\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: build jobs skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # The plans of the stages are read by the tools of the maintainer
          # (scripts/dipendenze.py, scripts/apri-tappa.sh): when a plan or the
          # roadmap changes, only the Scripts job runs, to check that they
          # still read it.
          if [ -n "$code" ] || echo "$changed" | grep -qE '^docs/tappe/|^docs/ROADMAP\.md$'; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=false" >> "$GITHUB_OUTPUT"
          fi

  # docs/adr/0011: a pull request either writes reference cases or does the
  # work, never both. The pending list, the folder tests/verifica/in-attesa/ (a
  # file per block of references), may change in either: references add their
  # file and work deletes it.
  references:
    name: Reference separation (ADR 0011)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that references and other files are not mixed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          references=$(echo "$changed" | grep -E '^tests/verifica/(casi/|sorgenti\.json$)' || true)
          others=$(echo "$changed" | grep -vE '^tests/verifica/(casi/|sorgenti\.json$|in-attesa/)' | grep -v '^$' || true)
          if [ -n "$references" ] && [ -n "$others" ]; then
            echo "::error::This pull request changes reference cases together with other files."
            echo "Reference files changed:"
            echo "$references"
            echo "Other files changed:"
            echo "$others"
            echo "Split it: references and work go in separate pull requests (docs/adr/0011)."
            exit 1
          fi
          echo "Reference separation respected."

  # docs/adr/0030, point 9 (0.7.5-P6): a pull request that moves the submodule
  # of solid-space must point to a commit of main of solid-space, not earlier
  # than the one written in the issue it closes (the line "Sottomodulo di
  # solid-space", written by .github/workflows/sottomodulo.yml). The pointer
  # is compared with the one at the point where the branch left main, so a
  # branch behind main is not taken for a change. Without an issue to close
  # (a pull request of the maintainer) only main is checked.
  submodule:
    name: Submodule pointer (ADR 0030)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the pointer of third_party/solid-space
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          TG_REPO: ${{ github.repository }}
        run: |
          fork=$(git merge-base "$BASE" "$HEAD")
          before=$(git ls-tree "$fork" third_party/solid-space | awk '{print $3}')
          after=$(git ls-tree "$HEAD" third_party/solid-space | awk '{print $3}')
          if [ "$before" = "$after" ]; then
            echo "The submodule of solid-space does not move (${after:-absent})."
            exit 0
          fi
          echo "The submodule of solid-space moves from ${before:-absent} to ${after:-absent}."
          if [ -z "$after" ]; then
            echo "::error title=Submodule pointer::this pull request removes third_party/solid-space"
            exit 1
          fi
          python3 scripts/dipendenze.py --controlla-puntatore "$after" --pr "$PR"

  format:
    name: Formatting (clang-format 18)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          set -o pipefail
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror 2>&1 | scripts/ci-annota.sh

  # The Python tools of the maintainer (scripts/dipendenze.py), on the oldest
  # Python they support (docs/tappe/fuori-tappa/F4-dipendenze.md).
  scripts:
    name: Scripts (Python)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test the scripts
        run: |
          mkdir -p build
          status=0
          python3 -m unittest discover -s scripts -p '*_test.py' -v > build/scripts.log 2>&1 || status=$?
          cat build/scripts.log
          if [ "$status" -ne 0 ]; then
            scripts/ci-annota.sh --coda 'Scripts (Python)' build/scripts.log
          fi
          exit "$status"

  # ccache in the three Linux jobs (docs/tappe/0.7.5/P36-tidy-e-ccache.md): a
  # cache per job, always restored, saved only by a push to main or the nightly
  # run, so that pull requests do not use up the cache space of the repository.
  # It is a tool of the CI, not a dependency of the program (docs/DECISIONI.md,
  # 2026-11-08). The whole-project tidy (preset tidy) does not use it.
  linux:
    name: Linux (GCC, Debug, clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request is compared with its base to find the touched files.
          fetch-depth: 0
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev clang-tidy-18 libgl1-mesa-dev libxkbcommon-dev ccache
          mkdir -p "$CCACHE_DIR"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: ${{ env.TG_AQT_SOURCE }}
          py7zrversion: ${{ env.TG_PY7ZR_VERSION }}
          cache: true
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-linux-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-linux-
      - name: Build, warnings as errors
        run: |
          set -o pipefail
          ccache --zero-stats
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | scripts/ci-annota.sh
          cmake --build --preset ci 2>&1 | scripts/ci-annota.sh
          ccache --show-stats
      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci -LE verifica -j "$(nproc)" 2>&1 | scripts/ci-annota.sh
      - name: Generate interface gallery
        if: needs.changes.outputs.gallery == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          build/ci/app/tecnigrafo-galleria build/galleria 2>&1 | scripts/ci-annota.sh
          test "$(find build/galleria -maxdepth 1 -name '*.png' -size +0c | wc -l)" -eq 12
          {
            echo '## Galleria dell’interfaccia'
            echo 'Scarica **galleria** dalla sezione **Artifacts** di questa esecuzione CI.'
            echo
            for image in build/galleria/*.png; do
              echo "- $(basename "$image")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload interface gallery
        if: needs.changes.outputs.gallery == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: galleria
          path: build/galleria/*.png
          if-no-files-found: error
      # In a pull request the checkout is the test merge commit that GitHub
      # builds on top of the latest main, while pull_request.base.sha can be an
      # older main. Comparing the checkout with that old base counts as changes
      # of the pull request everything merged into main since then: #585,
      # opened after #579 had changed this workflow, touched only cmd/ and
      # tests/ but got the whole-project tidy (62 min). The first parent of the
      # merge commit is the main it was built on, so the diff against it is
      # exactly what the pull request adds to today's main. The same base goes
      # to scripts/controlla.sh as TG_TIDY_BASE.
      - name: Choose the static analysis
        id: tidy
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full=true
          if [ "$EVENT" = pull_request ]; then
            if ! base=$(git rev-parse --verify --quiet 'HEAD^1'); then
              echo "The checkout has no parent to compare with: whole project."
            else
              changed=$(git diff --name-only "$base")
              echo "Comparing with ${base:0:12}, the main of the test merge commit. Files of the pull request:"
              echo "$changed"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              if echo "$changed" | grep -qE '^(\.clang-tidy$|CMakeLists\.txt$|CMakePresets\.json$|cmake/|\.github/workflows/ci\.yml$)'; then
                echo "The tidy configuration, CMake or this workflow changed: whole project."
              else
                full=false
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      # Same clang-tidy-18 and .clang-tidy as the CMake integration, run on the
      # compile commands of the build above: no second build.
      - name: Static analysis (files touched by the pull request)
        if: steps.tidy.outputs.full == 'false'
        env:
          TG_TIDY_BASE: ${{ steps.tidy.outputs.base }}
          TG_TIDY_MAX: '100000'
        run: |
          set -o pipefail
          scripts/controlla.sh --solo tidy --righe 200 2>&1 | scripts/ci-annota.sh
          head -n 3 build/controlla/tidy.log
      - name: Static analysis (whole project)
        if: steps.tidy.outputs.full == 'true'
        run: |
          set -o pipefail
          cmake --preset tidy -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" 2>&1 | scripts/ci-annota.sh
          cmake --build --preset tidy 2>&1 | scripts/ci-annota.sh
      - name: Save the compiler cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-linux-${{ github.sha }}

  # docs/adr/0038, point 3: Release with warnings as errors on Linux too, with
  # tests and verification, beside the Debug jobs. No clang-tidy: the Debug
  # job runs it on the same sources.
  linux-release:
    name: Linux (GCC, Release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # ccache: see the comment of the linux job.
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgl1-mesa-dev libxkbcommon-dev ccache
          mkdir -p "$CCACHE_DIR"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: ${{ env.TG_AQT_SOURCE }}
          py7zrversion: ${{ env.TG_PY7ZR_VERSION }}
          cache: true
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      # docs/adr/0038, point 4: the real project refuses -ffast-math. The rule
      # stops the configuration before any subproject, so this takes seconds.
      - name: Forbidden floating-point options stop the configuration
        run: |
          mkdir -p build
          status=0
          cmake --preset ci-release -B build/fast-math -DTG_BUILD_APP=OFF \
            -DCMAKE_CXX_FLAGS=-ffast-math > build/fast-math.log 2>&1 || status=$?
          cat build/fast-math.log
          expected='CMAKE_CXX_FLAGS has forbidden floating-point options (-ffast-math)'
          if [ "$status" -eq 0 ]; then
            echo "::error::The configuration with -ffast-math did not stop (docs/adr/0038, point 4)."
            exit 1
          fi
          if ! tr -s ' \n' '  ' < build/fast-math.log | grep -qF "$expected"; then
            echo "::error::The configuration with -ffast-math stopped without the message of docs/adr/0038: $expected"
            exit 1
          fi
          echo "Stopped as expected: $expected"
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-release-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-release-
      - name: Build Release, warnings as errors
        run: |
          set -o pipefail
          ccache --zero-stats
          cmake --preset ci-release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | scripts/ci-annota.sh
          cmake --build --preset ci-release 2>&1 | scripts/ci-annota.sh
          ccache --show-stats
      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci-release -LE verifica -j "$(nproc)" 2>&1 | scripts/ci-annota.sh
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --preset ci-release -L verifica --no-tests=error -j "$(nproc)" 2>&1 | scripts/ci-annota.sh
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifica-linux-release
          path: |
            build/ci-release/tests/verifica/casi*/
            build/ci-release/Testing/Temporary/LastTest.log
            build/ci-release/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
      - name: Save the compiler cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-release-${{ github.sha }}

  verifica:
    name: Verifica
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      # ccache: see the comment of the linux job.
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgl1-mesa-dev libxkbcommon-dev ccache
          mkdir -p "$CCACHE_DIR"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: ${{ env.TG_AQT_SOURCE }}
          py7zrversion: ${{ env.TG_PY7ZR_VERSION }}
          cache: true
      # install-qt-action puts its own Python first on PATH; the oracle wheels
      # are pinned for CPython 3.12 (tests/verifica/oracolo/requirements.txt).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-verifica-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-verifica-
      - name: Build verification tools
        run: |
          set -o pipefail
          ccache --zero-stats
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | scripts/ci-annota.sh
          cmake --build --preset ci --target tecnigrafo-script tecnigrafo confronta_immagini 2>&1 | scripts/ci-annota.sh
          ccache --show-stats
      - name: Verifica
        run: |
          set -o pipefail
          ctest --preset ci -L verifica --no-tests=error -j "$(nproc)" 2>&1 | scripts/ci-annota.sh
      - name: 'Oracolo ezdxf: answers'
        if: always()
        run: |
          # On failure, the last lines of the log become an annotation, so that an
          # agent without access to the CI logs can still read the cause.
          mkdir -p build
          status=0
          { python3 -m pip install --require-hashes --only-binary=:all: -r tests/verifica/oracolo/requirements.txt \
            && python3 tests/verifica/oracolo/controlla_casi.py tests/verifica/casi build/verifica-sorgenti --print-only; \
          } > build/oracolo-risposte.log 2>&1 || status=$?
          cat build/oracolo-risposte.log
          if [ "$status" -ne 0 ]; then
            scripts/ci-annota.sh --coda 'Oracolo ezdxf: answers' build/oracolo-risposte.log
          fi
          exit "$status"
      - name: Oracolo ezdxf
        run: |
          mkdir -p build
          status=0
          python3 tests/verifica/oracolo/controlla_casi.py tests/verifica/casi build/verifica-sorgenti --check-only --self-test > build/oracolo.log 2>&1 || status=$?
          cat build/oracolo.log
          if [ "$status" -ne 0 ]; then
            scripts/ci-annota.sh --coda 'Oracolo ezdxf' build/oracolo.log
          fi
          exit "$status"
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifica-linux
          path: |
            build/ci/tests/verifica/casi*/
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
      - name: Save the compiler cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-verifica-${{ github.sha }}

  # docs/adr/0016: every test, verification cases and application included,
  # runs instrumented; a memory error or undefined behaviour fails the job.
  sanitizers:
    name: Linux (ASan, UBSan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # ccache: see the comment of the linux job.
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libgl1-mesa-dev libxkbcommon-dev ccache
          mkdir -p "$CCACHE_DIR"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: ${{ env.TG_AQT_SOURCE }}
          py7zrversion: ${{ env.TG_PY7ZR_VERSION }}
          cache: true
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-sanitizers-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-sanitizers-
      - name: Build with AddressSanitizer and UBSan
        run: |
          set -o pipefail
          ccache --zero-stats
          cmake --preset asan -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | scripts/ci-annota.sh
          cmake --build --preset asan 2>&1 | scripts/ci-annota.sh
          ccache --show-stats
      - name: Test
        run: |
          set -o pipefail
          ctest --preset asan -LE verifica -j "$(nproc)" 2>&1 | scripts/ci-annota.sh
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --preset asan -L verifica --no-tests=error -j "$(nproc)" 2>&1 | scripts/ci-annota.sh
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifica-sanitizers
          path: |
            build/asan/tests/verifica/casi*/
            build/asan/Testing/Temporary/LastTest.log
            build/asan/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
      - name: Save the compiler cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v6
        with:
          path: build/ccache
          key: ${{ runner.os }}-ccache-sanitizers-${{ github.sha }}

  # docs/adr/0020: discover new readers without changing this job.
  fuzz:
    name: Fuzzing (io)
    needs: changes
    if: needs.changes.outputs.io == 'true'
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizer/lsan.supp:print_suppressions=0
      TG_VERIFICA_SOURCES_DIR: ${{ github.workspace }}/build/verifica-sorgenti
    steps:
      - uses: actions/checkout@v7
        with:
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libgtest-dev
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build fuzzing targets
        run: |
          set -o pipefail
          cmake --preset fuzz -DTG_VERIFICA_SOURCES_DIR="$TG_VERIFICA_SOURCES_DIR" 2>&1 | scripts/ci-annota.sh
          cmake --build --preset fuzz 2>&1 | scripts/ci-annota.sh
      - name: Fuzz every reader for three minutes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fuzz-crash
          status=0
          for source in tests/fuzz/fuzz_*.cpp; do
            target=$(basename "$source" .cpp)
            reader=${target#fuzz_}
            corpus="build/fuzz-corpus/$reader"
            crashes="build/fuzz-crash/$target"
            mkdir -p "$corpus" "$crashes"
            if [ -d "tests/fuzz/corpus/$reader" ]; then
              cp -a "tests/fuzz/corpus/$reader/." "$corpus/"
            fi
            # Use only manifest entries: the cache also contains a lock file.
            python3 - "$corpus" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          import sys
          manifest = Path("tests/verifica/sorgenti.json")
          if manifest.exists():
              for source in json.loads(manifest.read_text())["sources"]:
                  seed = Path(os.environ["TG_VERIFICA_SOURCES_DIR"]) / source["name"]
                  shutil.copyfile(seed, Path(sys.argv[1]) / ("source-" + source["name"]))
          PYTHON
            if ! "build/fuzz/tests/fuzz/$target" "$corpus" \
                -max_total_time=180 -timeout=10 -rss_limit_mb=2048 \
                -artifact_prefix="$crashes/"; then
              status=1
            fi
          done
          exit "$status"
      - name: Print failing inputs (at most 4 KiB each)
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in sorted(Path("build/fuzz-crash").rglob("*")):
              if path.is_file():
                  print(f"{path} ({path.stat().st_size} bytes, first 4096 in hex):", flush=True)
                  print(path.read_bytes()[:4096].hex(" "), flush=True)
          PYTHON
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash
          path: build/fuzz-crash/
          if-no-files-found: warn

  windows:
    name: Windows (MSVC, Release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: ${{ env.TG_AQT_SOURCE }}
          py7zrversion: ${{ env.TG_PY7ZR_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      # docs/adr/0038, point 3: Release, which links the release MSVC runtime
      # and the optimised Qt by itself. Debug stays on Linux, where the ASan
      # job looks for memory errors (docs/adr/0016); with Release the
      # runtime and import mappings of 0.7.5-P37 are no longer needed.
      - name: Build, warnings as errors
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cmake --preset ci-release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" *> build/ci-build.log
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            cmake --build --preset ci-release *>> build/ci-build.log
            $status = $LASTEXITCODE
          }
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci-annota.sh build/ci-build.log
          exit $status
      - name: Test
        run: |
          ctest --preset ci-release -LE verifica -j $env:NUMBER_OF_PROCESSORS *> build/ci-test.log
          $status = $LASTEXITCODE
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci-annota.sh build/ci-test.log
          exit $status
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset ci-release -L verifica --no-tests=error -j $env:NUMBER_OF_PROCESSORS *> build/ci-verifica.log
          $status = $LASTEXITCODE
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci-annota.sh build/ci-verifica.log
          exit $status
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifica-windows
          path: |
            build/ci-release/tests/verifica/casi*/
            build/ci-release/Testing/Temporary/LastTest.log
            build/ci-release/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  macos:
    name: macOS (Apple Clang, Release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # solid-space (docs/adr/0030): not --recursive, its own submodules are not needed.
          submodules: true
      - name: Install dependencies
        run: brew install ninja
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: ${{ env.TG_AQT_SOURCE }}
          py7zrversion: ${{ env.TG_PY7ZR_VERSION }}
          cache: true
      - uses: actions/cache@v6
        if: hashFiles('tests/verifica/sorgenti.json') != ''
        with:
          path: build/verifica-sorgenti
          key: ${{ runner.os }}-verifica-sorgenti-${{ hashFiles('tests/verifica/sorgenti.json') }}
      - name: Build, warnings as errors
        run: |
          set -o pipefail
          cmake --preset ci-release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" 2>&1 | scripts/ci-annota.sh
          cmake --build --preset ci-release 2>&1 | scripts/ci-annota.sh
      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci-release -LE verifica -j "$(sysctl -n hw.ncpu)" 2>&1 | scripts/ci-annota.sh
      - name: Verifica
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --preset ci-release -L verifica --no-tests=error -j "$(sysctl -n hw.ncpu)" 2>&1 | scripts/ci-annota.sh
      - name: Upload verification reports and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifica-macos
          path: |
            build/ci-release/tests/verifica/casi*/
            build/ci-release/Testing/Temporary/LastTest.log
            build/ci-release/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  # docs/adr/0038, point 5 (0.7.5-P5): the reports of the verification cases
  # must be the same on the three Release jobs, line by line. The artifacts are
  # the ones the three jobs already upload; the images are not compared here.
  # A difference blocks; a case listed in docs/verifica/sistemi.md, section
  # "Eccezioni", is skipped with a warning. The job runs only when the three
  # jobs passed: a failing case already blocks there.
  cross-platform:
    name: Cross-platform comparison
    needs: [changes, linux-release, windows, macos]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: verifica-linux-release
          path: build/sistemi/verifica-linux-release
      - uses: actions/download-artifact@v8
        with:
          name: verifica-windows
          path: build/sistemi/verifica-windows
      - uses: actions/download-artifact@v8
        with:
          name: verifica-macos
          path: build/sistemi/verifica-macos
      - name: Compare the reports of Linux, Windows and macOS
        run: |
          python3 scripts/confronta_sistemi.py \
            build/sistemi/verifica-linux-release build/sistemi/verifica-windows build/sistemi/verifica-macos
