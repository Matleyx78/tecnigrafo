# Advisory integration check; never updates the committed submodule pointer.
name: solid-space main

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize scheduled and manual runs so they cannot create duplicate issues.
concurrency:
  group: solid-space-main
  cancel-in-progress: false

jobs:
  check:
    name: Linux integration with solid-space main
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Use the latest solid-space main locally
        run: |
          git -C third_party/solid-space fetch --depth=1 origin main
          git -C third_party/solid-space checkout --detach FETCH_HEAD
          git -C third_party/solid-space log -1 --format='%H %s'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev
      - name: Configure without Qt, warnings as errors
        run: cmake --preset ci -DTG_BUILD_APP=OFF -DTG_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ci --parallel 2
      - name: Test
        run: ctest --preset ci --no-tests=error

  report:
    name: Report integration failure
    needs: check
    if: ${{ failure() && needs.check.result == 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'solid-space main rompe Tecnigrafo';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Il controllo di compatibilità con main di solid-space è fallito.\n\nEsecuzione: ${runUrl}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
